name: Translate App - Translate
on:
  workflow_call:
    inputs:
      translationServiceUrl:
        type: string
        default: https://xlftranslation-func-8370.azurewebsites.net
    secrets:
      GHTOKENWORKFLOW:
        required: false
defaults:
  run:
    shell: pwsh
jobs:
  Translate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHTOKENWORKFLOW }}
      - run: Write-Host "Translate via service"
