name: Translate App - Download Artifacts
on:
  workflow_call:
    secrets:
      GHTOKENWORKFLOW:
        required: false
defaults:
  run:
    shell: pwsh
jobs:
  Download:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHTOKENWORKFLOW }}
      - run: Write-Host "Download artifacts"
