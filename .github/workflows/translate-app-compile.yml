name: Translate App - Compile
on:
  workflow_call:
    secrets:
      GHTOKENWORKFLOW:
        required: false
defaults:
  run:
    shell: pwsh
jobs:
  Compile:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHTOKENWORKFLOW }}
      - run: Write-Host "Compile apps"
